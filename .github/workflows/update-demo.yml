name: Update Demo GIF

on:
  push:
    branches:
      - main
    paths:
      - 'assets/demo.tape'
      - 'internal/**'
      - 'cmd/**'
      - 'main.go'
      - 'internal/tui/**'

permissions:
  contents: write

jobs:
  update-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build gitai
        run: |
          mkdir -p bin
          go build -o bin/gitai main.go
          chmod +x bin/gitai

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-ibm-plex fontconfig
          fc-cache -f -v
          # ttyd is often not in standard repos or is old, downloading binary is safer
          wget -q -O ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.3/ttyd.x86_64
          sudo mv ttyd /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd

      - name: Install VHS
        run: go install github.com/charmbracelet/vhs@latest

      - name: Run VHS
        env:
          GITAI_AI_PROVIDER: openai
          OPENAI_API_KEY: {{ secrets.GITHUB_TOKEN }}
          OPENAI_BASE_URL: "https://models.github.ai/inference"
        run: vhs assets/demo.tape

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code assets/usage.gif || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(assets): update usage.gif [skip ci]"
          file_pattern: assets/usage.gif
